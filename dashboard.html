<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OSM building materials</title>
<meta name="description" content="Buildings with material tags in OpenStreetMap in Sweden, Norway, Denmark and France, with a street view of each building.">
<!-- site:head -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<!-- Data is loaded as scripts (not fetch) so the page works straight from file://. The index and the
     building centroids come first; building outlines are loaded per area from data/web/chunks/. -->
<script src="data/web/index.js"></script>
<script src="data/web/points.js"></script>
<style>
:root {
  color-scheme: light;
  --plane: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --border: rgba(11,11,11,.10); --wash: rgba(11,11,11,.05);
  --m-wood: #eda100; --m-brick: #e34948; --m-concrete: #2a78d6; --m-plaster: #e87ba4;
  --m-metal: #4a3aa7; --m-tar_paper: #1baf7a; --m-roof_tiles: #eb6834; --m-glass: #008300;
  --m-other: #b5b3ab; --seq: #2a78d6;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --plane: #0d0d0d; --surface: #1a1a19; --ink: #fff; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --border: rgba(255,255,255,.10); --wash: rgba(255,255,255,.06);
    --m-wood: #c98500; --m-brick: #e66767; --m-concrete: #3987e5; --m-plaster: #d55181;
    --m-metal: #9085e9; --m-tar_paper: #199e70; --m-roof_tiles: #d95926; --m-glass: #008300;
    --m-other: #5d5c57; --seq: #3987e5;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  display: grid; grid-template-columns: 440px 1fr; background: var(--plane); color: var(--ink);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
}
#side { overflow-y: auto; padding: 20px 16px 32px; display: flex; flex-direction: column; gap: 12px; }
#stage { display: grid; grid-template-columns: minmax(0, 1fr); height: 100vh; }
#stage.split { grid-template-columns: minmax(0, var(--split, 50%)) 8px minmax(0, 1fr); }
#svHandle { background: var(--grid); cursor: col-resize; touch-action: none; }
#svHandle:hover, #svHandle:focus-visible { background: var(--muted); outline: none; }
#stage:not(.split) #svHandle { display: none; }
#map { height: 100%; }
.back { display: inline-block; margin-bottom: 12px; font-size: 12px; color: var(--ink-2); text-decoration: none; }
.back:hover { color: var(--ink); }
h1 { font-size: 20px; margin: 0; letter-spacing: -.01em; }
.titlebar { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.seg.lang { flex: none; padding: 2px; }
.seg.lang button { flex: none; padding: 3px 10px; font-size: 12px; }
.sub { color: var(--ink-2); margin: 2px 0 0; font-size: 13px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px; }
.card h2 { font-size: 13px; font-weight: 600; margin: 0 0 2px; }
.card .hint { color: var(--muted); font-size: 12px; margin: 0 0 10px; }
.controls { display: grid; gap: 8px; }
.seg { display: flex; background: var(--wash); border-radius: 9px; padding: 3px; gap: 2px; }
.seg button {
  flex: 1; border: 0; background: none; color: var(--ink-2); font: inherit; font-size: 13px;
  padding: 6px 4px; border-radius: 7px; cursor: pointer;
}
.seg button:hover { color: var(--ink); }
.seg button:disabled { opacity: .4; cursor: default; }
.seg button[aria-pressed="true"] {
  background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 0 0 1px var(--border);
}
.seg button:focus-visible, .row:focus-visible { outline: 2px solid var(--seq); outline-offset: 1px; }
.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
.kpi .label { color: var(--ink-2); font-size: 12px; }
.kpi .value { font-size: 24px; font-weight: 600; letter-spacing: -.02em; line-height: 1.2; }
.kpi .note { color: var(--muted); font-size: 12px; }
.row {
  display: grid; grid-template-columns: 112px 1fr 92px; align-items: center; gap: 8px; width: 100%;
  padding: 3px 4px; border: 0; border-radius: 6px; background: none; color: inherit; font: inherit;
  text-align: left;
}
button.row { cursor: pointer; }
button.row:hover { background: var(--wash); }
.row.dim { opacity: .35; }
.row .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; }
.row .track { height: 10px; }
.row .bar { display: block; height: 100%; min-width: 2px; border-radius: 0 4px 4px 0; background: var(--seq); }
.row .num { text-align: right; font-variant-numeric: tabular-nums; font-size: 12px; color: var(--ink-2); }
.stack { display: flex; height: 16px; gap: 2px; }
.stack span { min-width: 0; }
.stack span:first-child { border-radius: 4px 0 0 4px; }
.stack span:last-child { border-radius: 0 4px 4px 0; }
.cmp { display: grid; grid-template-columns: 70px 1fr; gap: 8px 8px; align-items: center; font-size: 13px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 10px; font-size: 12px; color: var(--ink-2); }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.reset { border: 0; background: none; color: var(--seq); font: inherit; font-size: 12px; cursor: pointer; padding: 0; float: right; }
footer { color: var(--muted); font-size: 12px; }
footer a, .maplibregl-popup a { color: var(--seq); }
#tip {
  position: fixed; z-index: 10; pointer-events: none; display: none; max-width: 260px;
  background: var(--surface); color: var(--ink); border: 1px solid var(--border); border-radius: 8px;
  padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.18);
}
#tip b { display: block; font-size: 13px; margin-bottom: 2px; }
#tip div, .pop div { display: flex; justify-content: space-between; gap: 16px; color: var(--ink-2); }
#tip div span:last-child, .pop div span:last-child { color: var(--ink); font-variant-numeric: tabular-nums; text-align: right; }
.maplibregl-popup-content {
  background: var(--surface); color: var(--ink); border-radius: 10px; padding: 12px 14px;
  font: 12px/1.5 system-ui, sans-serif; min-width: 210px;
}
.maplibregl-popup-tip { display: none; }
.pop b { font-size: 13px; display: block; margin-bottom: 4px; }
.pop .actions { margin-top: 8px; align-items: center; }
.pop .svbtn {
  border: 1px solid var(--border); background: var(--wash); color: var(--ink); border-radius: 8px;
  padding: 4px 10px; cursor: pointer; font: inherit;
}
.pop .svbtn:hover { border-color: var(--muted); }
#maplegend {
  position: absolute; right: 12px; bottom: 28px; z-index: 2; background: var(--surface);
  border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; font-size: 12px;
  display: grid; gap: 2px; color: var(--ink-2);
}
#mapwrap { position: relative; min-height: 0; }
#maphint {
  position: absolute; left: 12px; top: 12px; z-index: 2; max-width: calc(100% - 80px); background: var(--surface);
  border: 1px solid var(--border); border-radius: 10px; padding: 6px 10px; font-size: 12px; color: var(--ink-2);
}
#maphint.alert { color: var(--ink); border-color: var(--muted); }
#sv { display: flex; flex-direction: column; min-height: 0; background: var(--surface); }
#sv[hidden] { display: none; }
#sv header { display: flex; align-items: start; gap: 12px; padding: 10px 12px; }
#sv header div { flex: 1; min-width: 0; }
#sv header b { display: block; font-size: 13px; }
#sv header span, #sv header a { font-size: 12px; color: var(--ink-2); }
#sv header button { border: 1px solid var(--border); background: none; color: var(--ink); border-radius: 8px; padding: 4px 10px; cursor: pointer; font: inherit; font-size: 12px; }
#sv iframe { flex: 1; width: 100%; border: 0; min-height: 0; }
#missing { padding: 40px; }
@media (max-width: 860px) {
  body { grid-template-columns: 1fr; }
  #side { overflow: visible; }
  #stage { height: 70vh; }
  #stage.split { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, var(--split, 50%)) 8px minmax(0, 1fr); height: 140vh; }
  #svHandle { cursor: row-resize; }
}
</style>
</head>
<body>
<aside id="side">
  <header>
    <!-- site:back -->
    <div class="titlebar">
      <h1 data-t="title"></h1>
      <div class="seg lang" id="lang" role="group" aria-label="Language"></div>
    </div>
    <p class="sub" data-t="subtitle"></p>
  </header>
  <div class="controls">
    <div class="seg" id="country" role="group"></div>
    <div class="seg" id="key" role="group"></div>
    <div class="seg" id="measure" role="group"></div>
  </div>
  <div class="kpis" id="kpis"></div>
  <section class="card">
    <button class="reset" id="reset" hidden data-t="reset"></button>
    <h2 id="matTitle"></h2>
    <p class="hint" data-t="matHint"></p>
    <div id="materials"></div>
  </section>
  <section class="card">
    <h2 data-t="typeTitle"></h2>
    <p class="hint" id="typeHint"></p>
    <div id="types"></div>
  </section>
  <section class="card">
    <h2 data-t="cmpTitle"></h2>
    <p class="hint" id="cmpHint"></p>
    <div class="cmp" id="compare"></div>
    <div class="legend" id="cmpLegend"></div>
  </section>
  <footer id="footer"></footer>
</aside>
<div id="stage">
  <div id="mapwrap"><div id="map"></div><div id="maphint" role="status" aria-live="polite"></div><div id="maplegend"></div></div>
  <div id="svHandle" role="separator" tabindex="0"></div>
  <section id="sv" hidden>
    <header>
      <div><b id="svTitle"></b><span id="svNote"></span> <a id="svLink" target="_blank" rel="noopener" data-t="svOpen"></a></div>
      <button id="svClose" data-t="svClose"></button>
    </header>
    <iframe id="svFrame" allowfullscreen referrerpolicy="no-referrer"></iframe>
  </section>
</div>
<div id="tip"></div>

<script>
"use strict";
// ---- text in both languages ---------------------------------------------------------------------
const I18N = {
  sv: {
    locale: "sv-SE",
    title: "Byggnadsmaterial i OpenStreetMap",
    subtitle: "Byggnader med materialtaggar i Sverige, Norge, Danmark och Frankrike",
    countries: { all: "Alla", sweden: "Sverige", norway: "Norge", denmark: "Danmark", france: "Frankrike" },
    keys: { "building:material": "Fasad", "roof:material": "Tak", "building:structure": "Stomme", "building:facade:material": "Fasad (detalj)" },
    measures: { count: "Antal", footprint: "Byggnadsarea", floor: "Våningsarea" },
    groups: { country: "Land", key: "Materialtagg", measure: "Mått" },
    kpiTagged: "Byggnader med materialtagg", kpiOf: (share, total, parts) => `${share} av ${total} byggnader i OSM · +${parts} byggnadsdelar`,
    kpiWithKey: (key) => `Med taggen ${key.toLowerCase()}`, kpiFootprint: "Byggnadsarea", kpiFootprintNote: "fotavtryck på marken",
    kpiFloor: "Våningsarea", kpiAssumed: (share) => `${share} av byggnaderna har antagna 2 våningar`,
    matTitle: (key, measure) => `${key}material · ${measure.toLowerCase()}`,
    matHint: "Klicka på ett material för att filtrera kartan.", reset: "Rensa filter",
    typeTitle: "Byggnadstyp", typeAll: "Alla material", typeWith: (m) => `Byggnader med ${m.toLowerCase()}`,
    cmpTitle: "Jämförelse mellan länderna", cmpHint: (measure, key) => `Andel av ${measure.toLowerCase()} per material · ${key.toLowerCase()}`,
    rest: (n) => `Övriga (${n})`, other: "Övriga", none: "Inga byggnader med den här taggen.",
    buildings: "Byggnader", footprint: "Byggnadsarea", floor: "Våningsarea", levels: "Våningar", assumed: "(antaget)",
    osmLink: "Visa i OpenStreetMap ↗", million: "milj.", loading: "Laddar byggnader …",
    svHint: "Klicka på en byggnad för detaljer och gatuvy, eller på en gata för att ställa dig där.",
    svOpen: "Öppna i Google Maps ↗", svClose: "Stäng", svResize: "Ändra storlek på karta och gatuvy", svShow: "Visa i gatuvy",
    svZoom: "Zooma in närmare för att välja en plats på gatan.",
    svNoStreet: (m) => `Ingen gata inom ${m} m. Gatubilder finns bara längs gator – klicka på en gata.`,
    svNoBuilding: (m) => `Ingen byggnad med materialtagg inom ${m} m från gatan – klicka närmare en färgad byggnad.`,
    svNoViewpoint: (m) => `Byggnaden syns inte från någon gata inom ${m} m, så det finns ingen gatuvy att visa.`,
    svHidden: "Ingen byggnad med materialtagg syns härifrån – andra hus skymmer. Prova en annan plats på gatan.",
    svNotFromHere: "Byggnaden syns inte från kamerans plats. Välj ”Visa i gatuvy” i rutan för att flytta kameran.",
    svNote: (m, moved) => `${m} m bort${moved ? ` · kameran flyttad ${moved} m till närmaste gata` : ""} · konen visar startriktningen. Klicka på en annan byggnad för att rikta om.`,
    footer: (fetched) => `Våningsarea = byggnadsarea × antal våningar (<code>building:levels</code>); saknas uppgiften antas 2 våningar.
      Data © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>-bidragsgivare via Overpass API, hämtad ${fetched}.
      Taggningen är ofullständig – siffrorna visar vad som är kartlagt, inte hela beståndet.
      Gatuvyn är Google Street View: kameran ställs på närmaste gata och Google visar närmaste panorama därifrån.`,
    noData: "<h1>Ingen data hittades</h1><p class=\"sub\">Kör <code>uv run python osm_materials.py --web</code> för att skapa <code>data/web/</code> och ladda om sidan.</p>",
    noMap: "Kartan kräver internetanslutning (MapLibre laddas från CDN).",
    materials: {
      wood: "Trä", brick: "Tegel", concrete: "Betong", plaster: "Puts", metal: "Metall", stone: "Sten",
      roof_tiles: "Takpannor", glass: "Glas", tar_paper: "Takpapp", steel: "Stål", grass: "Gräs/torv",
      slate: "Skiffer", copper: "Koppar", masonry: "Murverk", timber_framing: "Korsvirke",
      reinforced_concrete: "Armerad betong", sandstone: "Sandsten", limestone: "Kalksten",
      thatch: "Halm/vass", eternit: "Eternit", tile: "Tegelpannor", tiles: "Plattor", plastic: "Plast",
      cement_block: "Betongblock", metal_sheet: "Plåt", sheet_metal: "Plåt", gravel: "Grus", asphalt: "Asfalt",
      bitumen: "Bitumen", other: "Annat (other)", granite: "Granit", clay_tiles: "Lertegel", vinyl: "Vinyl",
      steel_frame: "Stålstomme", zinc: "Zink", aluminium: "Aluminium", rock: "Berg", roof_greening: "Grönt tak",
    },
    types: {
      yes: "Ospecificerad", house: "Villa", apartments: "Flerbostadshus", detached: "Friliggande hus",
      residential: "Bostadshus", terrace: "Radhus", shed: "Bod", garage: "Garage", garages: "Garagelänga",
      allotment_house: "Kolonistuga", church: "Kyrka", school: "Skola", industrial: "Industri",
      commercial: "Kommersiell", retail: "Handel", office: "Kontor", cabin: "Stuga", farm: "Gård",
      farm_auxiliary: "Ekonomibyggnad", barn: "Lada", roof: "Tak", hut: "Koja", public: "Offentlig",
      semidetached_house: "Parhus", service: "Teknikbyggnad", warehouse: "Lager", hospital: "Sjukhus",
      university: "Universitet", kindergarten: "Förskola", civic: "Samhällsbyggnad", hotel: "Hotell",
      bungalow: "Enplanshus", boathouse: "Båthus", greenhouse: "Växthus", part: "Byggnadsdel",
    },
  },
  en: {
    locale: "en-GB",
    title: "Building materials in OpenStreetMap",
    subtitle: "Buildings with material tags in Sweden, Norway, Denmark and France",
    countries: { all: "All", sweden: "Sweden", norway: "Norway", denmark: "Denmark", france: "France" },
    keys: { "building:material": "Facade", "roof:material": "Roof", "building:structure": "Structure", "building:facade:material": "Facade (detail)" },
    measures: { count: "Count", footprint: "Footprint area", floor: "Floor area" },
    groups: { country: "Country", key: "Material tag", measure: "Measure" },
    kpiTagged: "Buildings with a material tag", kpiOf: (share, total, parts) => `${share} of ${total} buildings in OSM · +${parts} building parts`,
    kpiWithKey: (key) => `With the ${key.toLowerCase()} tag`, kpiFootprint: "Footprint area", kpiFootprintNote: "ground footprint",
    kpiFloor: "Floor area", kpiAssumed: (share) => `${share} of the buildings have assumed 2 levels`,
    matTitle: (key, measure) => `${key} material · ${measure.toLowerCase()}`,
    matHint: "Click a material to filter the map.", reset: "Clear filter",
    typeTitle: "Building type", typeAll: "All materials", typeWith: (m) => `Buildings with ${m.toLowerCase()}`,
    cmpTitle: "Country comparison", cmpHint: (measure, key) => `Share of ${measure.toLowerCase()} per material · ${key.toLowerCase()}`,
    rest: (n) => `Other (${n})`, other: "Other", none: "No buildings with this tag.",
    buildings: "Buildings", footprint: "Footprint area", floor: "Floor area", levels: "Levels", assumed: "(assumed)",
    osmLink: "View in OpenStreetMap ↗", million: "million", loading: "Loading buildings …",
    svHint: "Click a building for details and street view, or click a street to stand there.",
    svOpen: "Open in Google Maps ↗", svClose: "Close", svResize: "Resize map and street view", svShow: "Show in street view",
    svZoom: "Zoom in closer to pick a spot on the street.",
    svNoStreet: (m) => `No street within ${m} m. Street view only exists along streets – click a street.`,
    svNoBuilding: (m) => `No building with a material tag within ${m} m of the street – click closer to a coloured building.`,
    svNoViewpoint: (m) => `The building cannot be seen from any street within ${m} m, so there is no street view to show.`,
    svHidden: "No building with a material tag can be seen from here – other buildings are in the way. Try another spot on the street.",
    svNotFromHere: "The building cannot be seen from the camera. Choose “Show in street view” in the popup to move the camera.",
    svNote: (m, moved) => `${m} m away${moved ? ` · camera moved ${moved} m to the nearest street` : ""} · the cone shows the initial direction. Click another building to re-aim.`,
    footer: (fetched) => `Floor area = footprint × number of levels (<code>building:levels</code>); 2 levels are assumed when the tag is missing.
      Data © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors via the Overpass API, fetched ${fetched}.
      Tagging is incomplete – the figures show what has been mapped, not the whole building stock.
      Street view is Google Street View: the camera is placed on the nearest street and Google shows the nearest panorama from there.`,
    noData: "<h1>No data found</h1><p class=\"sub\">Run <code>uv run python osm_materials.py --web</code> to create <code>data/web/</code>, then reload.</p>",
    noMap: "The map needs an internet connection (MapLibre is loaded from a CDN).",
    materials: {
      roof_tiles: "Roof tiles", tar_paper: "Tar paper", reinforced_concrete: "Reinforced concrete",
      metal_sheet: "Sheet metal", sheet_metal: "Sheet metal", cement_block: "Cement block", clay_tiles: "Clay tiles",
      timber_framing: "Timber framing", steel_frame: "Steel frame", other: "Other (tag value)", grass: "Grass/turf",
      roof_greening: "Green roof",
    },
    types: {
      yes: "Unspecified", part: "Building part", semidetached_house: "Semi-detached house",
      farm_auxiliary: "Farm auxiliary", allotment_house: "Allotment house", terrace: "Terraced house",
    },
  },
};
// Stats are summed over pre-aggregated rows: each row stands for `count` buildings with identical attributes.
const MEASURES = { count: (r) => r.count, footprint: (r) => r.footprint_m2, floor: (r) => r.floor_area_m2 };
// Colour follows the material, never its rank; everything else folds into "Other".
// The order is the palette's validated slot order (adjacent pairs stay colour-blind safe in stacks).
const COLORED = ["concrete", "roof_tiles", "tar_paper", "wood", "plaster", "glass", "metal", "brick"];

const params = new URLSearchParams(location.search);
const state = {
  lang: params.get("lang") === "sv" ? "sv" : "en",
  country: "all", key: "building:material", measure: "floor", material: null,
};
let T = I18N[state.lang];

const $ = (id) => document.getElementById(id);
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const group = (m) => (COLORED.includes(m) ? m : "other");
const humanize = (s) => (s.charAt(0).toUpperCase() + s.slice(1)).replaceAll("_", " ");
const label = (m) => T.materials[m] ?? humanize(m);
const typeLabel = (t) => T.types[t] ?? humanize(t);
const groupLabel = (g) => (g === "other" ? T.other : label(g));
let nf, dec, pctf, pctf1, pctf2;
function setLang(lang) {
  state.lang = lang;
  T = I18N[lang];
  document.documentElement.lang = lang;
  nf = new Intl.NumberFormat(T.locale, { maximumFractionDigits: 0 });
  dec = new Intl.NumberFormat(T.locale, { maximumFractionDigits: 1 });
  pctf = new Intl.NumberFormat(T.locale, { style: "percent", maximumFractionDigits: 0 });
  pctf1 = new Intl.NumberFormat(T.locale, { style: "percent", maximumFractionDigits: 1 });
  pctf2 = new Intl.NumberFormat(T.locale, { style: "percent", maximumFractionDigits: 2 });
  for (const el of document.querySelectorAll("[data-t]")) el.textContent = T[el.dataset.t];
  if (WEB) $("footer").innerHTML = T.footer(WEB.fetched);
  for (const [id, key] of Object.entries({ country: "country", key: "key", measure: "measure" })) $(id).setAttribute("aria-label", T.groups[key]);
  $("svHandle").setAttribute("aria-label", T.svResize);
  paintHint();
}
const pct = (x) => (x < 0.01 ? pctf2 : x < 0.1 ? pctf1 : pctf).format(x);
const compact = (v) => (v >= 1e6 ? `${dec.format(v / 1e6)} ${T.million}` : nf.format(v));
const fmt = (v) => (state.measure === "count" ? nf.format(v) : `${compact(v)} m²`);

// ---- data -------------------------------------------------------------------------------------
// data/web/index.js: per-country totals, dictionaries, aggregated stats rows and the chunk list.
const WEB = window.OSM_WEB ?? null;
/** Stats rows [country, type, ...code per key, assumed, count, footprint, floor] as objects like a feature's properties. */
const ROWS = (WEB?.stats ?? []).map((row) => {
  const n = WEB.keys.length;
  const [assumed, count, footprint, floor] = row.slice(2 + n);
  const r = { country: WEB.countries[row[0]], type: WEB.types[row[1]], levels_assumed: assumed === 1, count, footprint_m2: footprint, floor_area_m2: floor };
  row.slice(2, 2 + n).forEach((c, j) => c && (r[`n:${WEB.keys[j]}`] = WEB.materials[c - 1]));
  return r;
});
const ROWS_OF = Object.fromEntries((WEB?.countries ?? []).map((c) => [c, ROWS.filter((r) => r.country === c)]));
const selectedRows = () => (state.country === "all" ? ROWS : ROWS_OF[state.country]);
const selectedTotal = () =>
  state.country === "all" ? WEB.countries.reduce((s, c) => s + WEB.country[c].total_buildings, 0) : WEB.country[state.country].total_buildings;

/** data/web/points.js: one centroid per building, delta-encoded in 1e-5 degrees, with a material code per key. */
function centroidFeatures() {
  const out = [];
  for (const country of WEB.countries) {
    const P = window.OSM_POINTS[country];
    let x = 0;
    let y = 0;
    for (let i = 0; i < P.lon.length; i++) {
      x += P.lon[i];
      y += P.lat[i];
      const properties = { country };
      WEB.keys.forEach((k, j) => {
        const c = P[`c${j}`][i];
        if (c) properties[`n:${k}`] = WEB.materials[c - 1];
      });
      out.push({ type: "Feature", properties, geometry: { type: "Point", coordinates: [x / 1e5, y / 1e5] } });
    }
  }
  return out;
}

/** Sum of the current measure per category, largest first. */
function tally(rows, category) {
  const get = MEASURES[state.measure];
  const sums = new Map();
  for (const r of rows) {
    const c = category(r);
    if (c === undefined) continue;
    const row = sums.get(c) ?? sums.set(c, { id: c, value: 0, count: 0, footprint: 0, floor: 0 }).get(c);
    row.value += get(r);
    row.count += r.count;
    row.footprint += r.footprint_m2;
    row.floor += r.floor_area_m2;
  }
  return [...sums.values()].sort((a, b) => b.value - a.value);
}
const countOf = (rows) => rows.reduce((s, r) => s + r.count, 0);

/** Top n rows, the rest folded into one "Other" row. */
function topN(rows, n, keep = null) {
  if (rows.length <= n + 1) return rows;
  const kept = rows.findIndex((r) => r.id === keep);
  if (kept >= n) rows = [...rows.slice(0, n - 1), rows[kept], ...rows.slice(n - 1).filter((r) => r.id !== keep)];
  const rest = rows.slice(n).reduce(
    (acc, r) => ({ ...acc, value: acc.value + r.value, count: acc.count + r.count, footprint: acc.footprint + r.footprint, floor: acc.floor + r.floor }),
    { id: "__rest", value: 0, count: 0, footprint: 0, floor: 0, n: rows.length - n },
  );
  return [...rows.slice(0, n), rest];
}

// ---- rendering --------------------------------------------------------------------------------
/** Segmented control: built once, then only the pressed state and labels are updated. */
function segmented(el, options, prop, onChange) {
  if (!el.children.length) {
    for (const id of Object.keys(options)) {
      const b = document.createElement("button");
      b.dataset.id = id;
      b.onclick = () => {
        state[prop] = id;
        onChange();
      };
      el.append(b);
    }
  }
  for (const b of el.children) {
    b.textContent = options[b.dataset.id];
    b.setAttribute("aria-pressed", String(state[prop] === b.dataset.id));
    b.disabled = prop === "country" && b.dataset.id !== "all" && !WEB.country[b.dataset.id];
  }
}

function tipRows(r) {
  return `<div><span>${T.buildings}</span><span>${nf.format(r.count)}</span></div>
    <div><span>${T.footprint}</span><span>${nf.format(r.footprint)} m²</span></div>
    <div><span>${T.floor}</span><span>${nf.format(r.floor)} m²</span></div>`;
}

function attachTip(el, html) {
  el.onmousemove = (e) => {
    const tip = $("tip");
    tip.innerHTML = html;
    tip.style.display = "block";
    tip.style.left = `${Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8)}px`;
    tip.style.top = `${Math.min(e.clientY + 14, innerHeight - tip.offsetHeight - 8)}px`;
  };
  el.onmouseleave = () => ($("tip").style.display = "none");
}

function bars(el, rows, { name, color, onClick, selected }) {
  el.innerHTML = "";
  const max = Math.max(...rows.map((r) => r.value), 1);
  const total = rows.reduce((s, r) => s + r.value, 0) || 1;
  for (const r of rows) {
    const rest = r.id === "__rest";
    const row = document.createElement(onClick && !rest ? "button" : "div");
    row.className = "row" + (selected && selected !== r.id ? " dim" : "");
    const text = esc(rest ? T.rest(r.n) : name(r.id));
    row.innerHTML = `<span class="name">${text}</span>
      <span class="track"><span class="bar" style="width:${(r.value / max) * 100}%;background:${rest ? "var(--m-other)" : color(r.id)}"></span></span>
      <span class="num">${fmt(r.value)}</span>`;
    if (onClick && !rest) row.onclick = () => onClick(r.id);
    attachTip(row, `<b>${text} · ${pct(r.value / total)}</b>${tipRows(r)}`);
    el.append(row);
  }
  if (!rows.length) el.innerHTML = `<p class="hint">${T.none}</p>`;
}

function renderKpis(rows, tagged) {
  const total = selectedTotal();
  const sum = (list, get) => list.reduce((s, r) => s + get(r), 0);
  const n = countOf(tagged);
  const assumed = countOf(tagged.filter((r) => r.levels_assumed));
  // total_buildings counts building=* only, so building:part-only objects are reported separately.
  const whole = countOf(rows.filter((r) => r.type !== "part"));
  const tiles = [
    [T.kpiTagged, nf.format(whole), T.kpiOf(pct(whole / total), compact(total), nf.format(countOf(rows) - whole))],
    [T.kpiWithKey(T.keys[state.key]), nf.format(n), state.key],
    [T.kpiFootprint, `${compact(sum(tagged, (r) => r.footprint_m2))} m²`, T.kpiFootprintNote],
    [T.kpiFloor, `${compact(sum(tagged, (r) => r.floor_area_m2))} m²`, n ? T.kpiAssumed(pct(assumed / n)) : ""],
  ];
  $("kpis").innerHTML = tiles
    .map(([l, v, note]) => `<div class="kpi"><div class="label">${l}</div><div class="value">${v}</div><div class="note">${note}</div></div>`)
    .join("");
}

function renderCompare() {
  const nkey = `n:${state.key}`;
  $("compare").innerHTML = "";
  for (const [country, name] of Object.entries(T.countries)) {
    if (!WEB.country[country]) continue;
    const rows = tally(ROWS_OF[country], (r) => (r[nkey] ? group(r[nkey]) : undefined));
    const total = rows.reduce((s, r) => s + r.value, 0);
    const other = rows.find((x) => x.id === "other") ?? { id: "other", value: 0, count: 0, footprint: 0, floor: 0 };
    for (const r of rows) {
      if (r.id !== "other" && r.value / total < 0.003) {
        other.value += r.value; other.count += r.count; other.footprint += r.footprint; other.floor += r.floor;
        r.value = 0;
      }
    }
    const stack = document.createElement("div");
    stack.className = "stack";
    for (const id of [...COLORED, "other"]) {
      const r = id === "other" ? other : rows.find((x) => x.id === id);
      if (!r || r.value <= 0) continue;
      const seg = document.createElement("span");
      seg.style.cssText = `flex:${r.value};background:var(--m-${id})`;
      attachTip(seg, `<b>${name} · ${esc(groupLabel(id))} · ${pct(r.value / total)}</b>${tipRows(r)}`);
      stack.append(seg);
    }
    const lab = document.createElement("span");
    lab.textContent = name;
    lab.style.fontWeight = country === state.country ? 600 : 400;
    $("compare").append(lab, stack);
  }
  $("cmpLegend").innerHTML = [...COLORED, "other"]
    .map((id) => `<span><i class="sw" style="background:var(--m-${id})"></i>${esc(groupLabel(id))}</span>`)
    .join("");
  $("cmpHint").textContent = T.cmpHint(T.measures[state.measure], T.keys[state.key]);
}

function render() {
  segmented($("lang"), { sv: "SV", en: "EN" }, "lang", () => {
    setLang(state.lang);
    try {
      history.replaceState(null, "", `?lang=${state.lang}${location.hash}`);
    } catch {
      // Some browsers refuse to rewrite file:// URLs; the language switch works without it.
    }
    render();
  });
  const select = () => {
    state.material = null;
    render();
  };
  segmented($("country"), T.countries, "country", () => {
    select();
    fitCountry();
  });
  segmented($("key"), T.keys, "key", select);
  segmented($("measure"), T.measures, "measure", render);

  const nkey = `n:${state.key}`;
  const rows = selectedRows();
  const tagged = rows.filter((r) => r[nkey]);
  renderKpis(rows, tagged);

  $("matTitle").textContent = T.matTitle(T.keys[state.key], T.measures[state.measure]);
  bars($("materials"), topN(tally(tagged, (r) => r[nkey]), 10, state.material), {
    name: label,
    color: (id) => `var(--m-${group(id)})`,
    selected: state.material,
    onClick: (id) => {
      state.material = state.material === id ? null : id;
      render();
    },
  });
  $("reset").hidden = !state.material;

  const inFilter = state.material ? tagged.filter((r) => r[nkey] === state.material) : tagged;
  $("typeHint").textContent = state.material ? T.typeWith(label(state.material)) : T.typeAll;
  bars($("types"), topN(tally(inFilter, (r) => r.type), 8), { name: typeLabel, color: () => "var(--seq)" });
  renderCompare();
  updateMap();
  if (sv.pos) svHeader();
}
$("reset").onclick = () => {
  state.material = null;
  render();
};

// ---- map --------------------------------------------------------------------------------------
const dark = matchMedia("(prefers-color-scheme: dark)").matches;
const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
let map = null;
let mapReady = false;

const outerRing = (geom) => (geom.type === "Polygon" ? geom.coordinates[0] : geom.coordinates[0][0]);
/** Vertex average of the outer ring, cached on the feature. */
function centroid(f) {
  if (f.center) return f.center;
  if (f.geometry.type === "Point") return (f.center = f.geometry.coordinates);
  const ring = outerRing(f.geometry);
  const n = ring.length - 1;
  return (f.center = [0, 1].map((i) => ring.slice(0, n).reduce((s, c) => s + c[i], 0) / n));
}

function colorExpr() {
  const expr = ["match", ["get", `n:${state.key}`]];
  for (const id of COLORED) expr.push(id, css(`--m-${id}`));
  return [...expr, css("--m-other")];
}

/** The selection filter, shared by the map layers and the street-view building search. */
function inSelection(p) {
  const nkey = `n:${state.key}`;
  return (state.material ? p[nkey] === state.material : Boolean(p[nkey])) && (state.country === "all" || p.country === state.country);
}

function updateMap() {
  if (!mapReady) return;
  const nkey = `n:${state.key}`;
  const filter = ["all", state.material ? ["==", ["get", nkey], state.material] : ["has", nkey]];
  if (state.country !== "all") filter.push(["==", ["get", "country"], state.country]);
  for (const layer of ["dots", "fill", "outline"]) map.setFilter(layer, filter);
  map.setPaintProperty("dots", "circle-color", colorExpr());
  map.setPaintProperty("fill", "fill-color", colorExpr());
  const present = new Set(selectedRows().map((r) => r[nkey]).filter(Boolean).map(group));
  $("maplegend").innerHTML = [...COLORED, "other"]
    .filter((id) => present.has(id))
    .map((id) => `<span><i class="sw" style="background:var(--m-${id})"></i>${esc(groupLabel(id))}</span>`)
    .join("");
  syncChunks();
}

function fitCountry() {
  if (!map) return;
  const b = new maplibregl.LngLatBounds();
  for (const c of state.country === "all" ? WEB.countries : [state.country]) {
    const [w, s, e, n] = WEB.country[c].bbox;
    b.extend([w, s]).extend([e, n]);
  }
  map.fitBounds(b, { padding: 40, duration: 900 });
}

function popupHtml(p) {
  const rows = Object.keys(T.keys)
    .filter((k) => p[k])
    .map((k) => `<div><span>${T.keys[k]}</span><span>${esc(p[k])}</span></div>`)
    .join("");
  return `<div class="pop"><b>${esc(p.name ?? typeLabel(p.type))}</b>${rows}
    <div><span>${T.levels}</span><span>${dec.format(p.levels)}${p.levels_assumed ? ` ${T.assumed}` : ""}</span></div>
    <div><span>${T.footprint}</span><span>${nf.format(p.footprint_m2)} m²</span></div>
    <div><span>${T.floor}</span><span>${nf.format(p.floor_area_m2)} m²</span></div>
    <div class="actions"><button class="svbtn" type="button">${T.svShow}</button>
    <a href="https://www.openstreetmap.org/${esc(p.osm_id)}" target="_blank" rel="noopener">${T.osmLink}</a></div></div>`;
}

// ---- building outlines, loaded per area -------------------------------------------------------
const CHUNK_ZOOM = 11.5; // outlines are drawn from zoom 12; start loading just before
const CHUNK_CACHE = 24; // chunks kept in memory (about 3000 buildings each)
const CHUNKS = (WEB?.chunks ?? []).map(([id, w, s, e, n]) => ({
  id, country: id.slice(0, id.lastIndexOf("-")), bbox: [w, s, e, n], features: null, promise: null, used: 0,
}));
const byId = new Map(); // osm_id -> loaded feature
const chunkWaiters = new Map();
window.OSM_CHUNK = (id, fc) => chunkWaiters.get(id)?.(fc);
let loadingChunks = 0;

const overlaps = (a, b) => a[0] <= b[2] && b[0] <= a[2] && a[1] <= b[3] && b[1] <= a[3];
const chunksIn = (bbox) => CHUNKS.filter((c) => overlaps(c.bbox, bbox) && (state.country === "all" || c.country === state.country));

/** Loads one chunk script (once); resolves with its features. */
function loadChunk(c) {
  c.used = performance.now();
  if (c.features) return Promise.resolve(c.features);
  if (!c.promise) {
    loadingChunks += 1;
    paintHint();
    c.promise = new Promise((resolve, reject) => {
      const script = document.createElement("script");
      const done = (fc) => {
        chunkWaiters.delete(c.id);
        script.remove();
        if (fc) resolve(fc);
        else reject(new Error(`Could not load chunk ${c.id}`));
      };
      chunkWaiters.set(c.id, done);
      script.onerror = () => done(null);
      script.onload = () => chunkWaiters.has(c.id) && done(null); // loaded but never called OSM_CHUNK
      script.src = `data/web/chunks/${c.id}.js`;
      document.head.append(script);
    })
      .then((fc) => {
        c.features = fc.features;
        for (const f of c.features) byId.set(f.properties.osm_id, f);
        return c.features;
      })
      .finally(() => {
        c.promise = null;
        loadingChunks -= 1;
        paintHint();
      });
  }
  return c.promise;
}

/** Drops the least recently used chunks beyond CHUNK_CACHE, except those in keep. */
function evictChunks(keep) {
  const loaded = CHUNKS.filter((c) => c.features).sort((a, b) => a.used - b.used);
  for (const c of loaded.slice(0, Math.max(0, loaded.length - CHUNK_CACHE))) {
    if (keep.includes(c) || c.features.includes(sv.target)) continue;
    for (const f of c.features) if (byId.get(f.properties.osm_id) === f) byId.delete(f.properties.osm_id);
    c.features = null;
  }
}

let shownChunks = "";
let syncSeq = 0;
/** Puts the outlines of the chunks around the view into the map's building source. */
async function syncChunks() {
  if (!mapReady || map.getZoom() < CHUNK_ZOOM) return;
  const seq = ++syncSeq;
  const b = map.getBounds();
  const [dx, dy] = [(b.getEast() - b.getWest()) / 4, (b.getNorth() - b.getSouth()) / 4];
  const wanted = chunksIn([b.getWest() - dx, b.getSouth() - dy, b.getEast() + dx, b.getNorth() + dy]);
  const own = sv.target && CHUNKS.find((c) => c.features?.includes(sv.target)); // keeps the target outlined
  if (own && !wanted.includes(own)) wanted.push(own);
  await Promise.allSettled(wanted.map(loadChunk));
  if (seq !== syncSeq) return; // a newer view took over
  const ids = wanted.filter((c) => c.features).map((c) => c.id).join();
  if (ids !== shownChunks) {
    shownChunks = ids;
    map.getSource("buildings").setData({ type: "FeatureCollection", features: wanted.flatMap((c) => c.features ?? []) });
  }
  evictChunks(wanted);
}

/** Metres east/north from a to b on a local flat projection; fine at street scale. */
function offsetM(a, b) {
  return [(b[0] - a[0]) * 111320 * Math.cos((a[1] * Math.PI) / 180), (b[1] - a[1]) * 110540];
}
/** The point x metres east and y metres north of a. */
const fromOffset = (a, x, y) => [a[0] + x / (111320 * Math.cos((a[1] * Math.PI) / 180)), a[1] + y / 110540];
const distM = (a, b) => Math.hypot(...offsetM(a, b));
function destination(a, deg, m) {
  const t = (deg * Math.PI) / 180;
  return fromOffset(a, m * Math.sin(t), m * Math.cos(t));
}
/** Bounding box [w, s, e, n] of everything within m metres of pos. */
const around = (pos, m) => [...fromOffset(pos, -m, -m), ...fromOffset(pos, m, m)];
const outline = (f) => (f.geometry.type === "Point" ? [f.geometry.coordinates] : outerRing(f.geometry));

// ---- plane geometry in local metres [east, north] -------------------------------------------
/** Compass bearing in degrees from a to b. */
const bearingM = (a, b) => ((Math.atan2(b[0] - a[0], b[1] - a[1]) * 180) / Math.PI + 360) % 360;
const bboxOf = (pts) =>
  pts.reduce(([w, s, e, n], [x, y]) => [Math.min(w, x), Math.min(s, y), Math.max(e, x), Math.max(n, y)], [Infinity, Infinity, -Infinity, -Infinity]);
const mean = (ring) => [0, 1].map((i) => ring.reduce((s, v) => s + v[i], 0) / ring.length);
const lines = (g) => (g.type === "LineString" ? [g.coordinates] : g.type === "MultiLineString" ? g.coordinates : []);
const rings = (g) => (g.type === "Polygon" ? g.coordinates : g.type === "MultiPolygon" ? g.coordinates.flat() : []);
/** Closest point to the origin on segment a-b: [x, y, distance]. */
function closestOnSegment(a, b) {
  const [dx, dy] = [b[0] - a[0], b[1] - a[1]];
  const len2 = dx * dx + dy * dy;
  const t = len2 ? Math.min(Math.max(-(a[0] * dx + a[1] * dy) / len2, 0), 1) : 0;
  const [x, y] = [a[0] + t * dx, a[1] + t * dy];
  return [x, y, Math.hypot(x, y)];
}
/** Distance from p to the nearest edge of a ring (or to a single point). */
function ringDist(p, ring) {
  const rel = (v) => [v[0] - p[0], v[1] - p[1]];
  if (ring.length === 1) return Math.hypot(...rel(ring[0]));
  let best = Infinity;
  for (let i = 1; i < ring.length; i++) best = Math.min(best, closestOnSegment(rel(ring[i - 1]), rel(ring[i]))[2]);
  return best;
}
/** Ray-casting point-in-polygon test for one ring. */
function inRing([x, y], ring) {
  let inside = false;
  for (let i = 1; i < ring.length; i++) {
    const [[x1, y1], [x2, y2]] = [ring[i - 1], ring[i]];
    if (y1 > y !== y2 > y && x < x1 + ((y - y1) * (x2 - x1)) / (y2 - y1)) inside = !inside;
  }
  return inside;
}
/** Fraction t of the way from p to q where the segment first crosses an edge of ring, or null. */
function firstCrossing(p, q, ring) {
  const [rx, ry] = [q[0] - p[0], q[1] - p[1]];
  let first = null;
  for (let i = 1; i < ring.length; i++) {
    const [a, b] = [ring[i - 1], ring[i]];
    const [sx, sy] = [b[0] - a[0], b[1] - a[1]];
    const den = rx * sy - ry * sx;
    if (!den) continue;
    const [ax, ay] = [a[0] - p[0], a[1] - p[1]];
    const t = (ax * sy - ay * sx) / den;
    const u = (ax * ry - ay * rx) / den;
    if (t >= 0 && t <= 1 && u >= 0 && u <= 1 && (first === null || t < first)) first = t;
  }
  return first;
}
/** Points every `step` metres along a polyline, its vertices included. */
function* along(line, step) {
  for (let i = 1; i < line.length; i++) {
    const [a, b] = [line[i - 1], line[i]];
    const n = Math.max(1, Math.ceil(Math.hypot(b[0] - a[0], b[1] - a[1]) / step));
    for (let k = 0; k < n; k++) yield [a[0] + ((b[0] - a[0]) * k) / n, a[1] + ((b[1] - a[1]) * k) / n];
  }
  if (line.length) yield line[line.length - 1];
}

// ---- street view ------------------------------------------------------------------------------
// Google's keyless embed shows the panorama nearest the point it is given, and panoramas are taken along
// streets. So the camera always stands on a street of the base map, at a spot from which the building can
// be seen: other buildings (with their heights) are checked along each line of sight. Where no street
// sees the building, no image is shown, rather than a panorama of something else.
const SV_MIN_ZOOM = 14; // the base map has every street and building from zoom 14
const SV_SNAP_M = 30; // a click this close to a street stands on it
const SV_VIEWPOINT_M = 60; // "Show in street view" looks for a street this close to the building
const SV_RANGE_M = 150; // farthest building a street click aims at; beyond this it is too small to see
const SV_FOV = 90; // Google's embedded viewer opens at roughly this horizontal field of view
const CAMERA_M = 2.5; // height of a Street View camera
const SNAP_MS = 450; // camera slide from the clicked point to the street
const sv = { pos: null, target: null, heading: 0, dist: 0, moved: 0 };
let svSeq = 0; // bumped by every street-view request and by closing, so a request still waiting gives up

/**
 * Extra metres added to a street's distance, so a nearby main street beats a driveway; null = no Street View.
 * Classes are the OpenMapTiles transportation layer of the OpenFreeMap base map.
 */
function streetPenalty(p) {
  if (p.brunnel === "tunnel" || p.indoor === 1) return null;
  if (p.class === "path") return p.subclass === "pedestrian" ? 4 : null;
  if (p.class === "service") return p.service === "driveway" || p.service === "parking_aisle" ? 12 : 6;
  return { motorway: 0, trunk: 0, primary: 0, secondary: 0, tertiary: 0, minor: 0, busway: 0, track: 15 }[p.class] ?? null;
}

/** Streets (with penalty) and buildings (with height) of the loaded base-map tiles within r metres of origin. */
function surroundings(origin, r) {
  const box = [-r, -r, r, r];
  const streets = [];
  for (const f of map.querySourceFeatures("openmaptiles", { sourceLayer: "transportation" })) {
    const penalty = streetPenalty(f.properties);
    if (penalty === null) continue;
    for (const line of lines(f.geometry)) {
      const m = line.map((c) => offsetM(origin, c));
      if (overlaps(bboxOf(m), box)) streets.push({ penalty, line: m });
    }
  }
  const walls = [];
  for (const f of map.querySourceFeatures("openmaptiles", { sourceLayer: "building" })) {
    for (const ring of rings(f.geometry)) {
      const m = ring.map((c) => offsetM(origin, c));
      const bbox = bboxOf(m);
      if (overlaps(bbox, box)) walls.push({ ring: m, bbox, height: f.properties.render_height ?? 10 });
    }
  }
  return { streets, walls };
}

/** Building height in metres from its tags: height, else levels × 3 m. */
const heightOf = (p) => (parseFloat(p.height) > 0 ? parseFloat(p.height) : p.levels * 3);

/** Building f as a sight target in metres around origin: outline, centre, facade samples and its obstacles. */
function sightTarget(f, origin, walls) {
  const ring = outline(f).map((c) => offsetM(origin, c));
  const centre = offsetM(origin, centroid(f));
  const perimeter = ring.slice(1).reduce((s, v, i) => s + Math.hypot(v[0] - ring[i][0], v[1] - ring[i][1]), 0);
  const samples = ring.length === 1 ? [ring[0]] : [...along(ring, Math.max(2, perimeter / 48))].slice(0, -1); // closed: last = first
  // The base map has this building too (and the whole building when f is a part of it): not obstacles.
  const obstacles = walls.filter((w) => !inRing(centre, w.ring) && !inRing(mean(w.ring), ring));
  // Aim the line of sight at the lower facade (where the material is), not at a spire or roof top.
  return { ring, centre, samples, obstacles, sight: Math.min(Math.max(CAMERA_M + 1, 0.5 * heightOf(f.properties)), 10) };
}

/** The facade samples a camera at p can see: not round the back of the building, not behind a taller one. */
function seenFrom(p, target) {
  const seen = [];
  for (const q of target.samples) {
    const len = Math.hypot(q[0] - p[0], q[1] - p[1]);
    if (len < 1) continue;
    const k = (len - 0.75) / len; // stop just short of the facade itself
    const e = [p[0] + (q[0] - p[0]) * k, p[1] + (q[1] - p[1]) * k];
    if (firstCrossing(p, e, target.ring) !== null) continue;
    const box = bboxOf([p, e]);
    const blocked = target.obstacles.some((w) => {
      if (!overlaps(w.bbox, box)) return false;
      const t = firstCrossing(p, e, w.ring);
      // The line of sight climbs from the camera to the facade, so a lower building in front lets it pass.
      return t !== null && w.height > CAMERA_M + (target.sight - CAMERA_M) * t * k;
    });
    if (!blocked) seen.push(q);
  }
  return seen;
}

/** From p: heading to the middle of the seen facade, the angle it spans, and the distance to its far end. */
function aim(p, seen, centre) {
  const base = bearingM(p, centre);
  const rel = seen.map((q) => ((bearingM(p, q) - base + 540) % 360) - 180);
  const [lo, hi] = [Math.min(...rel), Math.max(...rel)];
  const reach = Math.max(...seen.map((q) => Math.hypot(q[0] - p[0], q[1] - p[1])));
  return { heading: (base + (lo + hi) / 2 + 360) % 360, span: hi - lo, reach };
}

/** The first of the buildings fs (nearest first) a camera at p, in metres around origin, sees: { f, view } or null. */
function firstSeen(p, fs, origin, walls) {
  for (const f of fs) {
    const target = sightTarget(f, origin, walls);
    if (inRing(p, target.ring)) continue; // a street mapped through the building: no meaningful view
    const seen = seenFrom(p, target);
    if (seen.length) return { f, view: aim(p, seen, target.centre) };
  }
  return null;
}

/** The best spot on a street within SV_VIEWPOINT_M to look at building f from, or null if none sees it. */
function viewpointFor(f) {
  const origin = centroid(f);
  const size = Math.max(...outline(f).map((c) => distM(origin, c)));
  const { streets, walls } = surroundings(origin, size + SV_VIEWPOINT_M + 30);
  const target = sightTarget(f, origin, walls);
  let best = null;
  for (const { penalty, line } of streets) {
    for (const p of along(line, 5)) {
      const d = ringDist(p, target.ring);
      if (d > SV_VIEWPOINT_M || inRing(p, target.ring)) continue;
      const seen = seenFrom(p, target);
      if (!seen.length) continue;
      const view = aim(p, seen, target.centre);
      // Fill most of the view, see much of the building, do not stand against its wall, prefer main streets.
      const score = Math.min(view.span, 70) - Math.max(0, view.span - 100) / 2 + (20 * seen.length) / target.samples.length - 4 * Math.max(0, 6 - d) - penalty;
      if (!best || score > best.score) best = { score, p, view };
    }
  }
  return best && { pos: fromOffset(origin, ...best.p), ...best.view };
}

/** Resolves once the base-map tiles in view are loaded: the street search reads its streets and buildings. */
const tilesLoaded = () => (map.areTilesLoaded() ? Promise.resolve() : new Promise((resolve) => map.once("idle", resolve)));

/** A street click: stand on the nearest street and look at the nearest selected building seen from there. */
async function streetClick(click) {
  if (map.getZoom() < SV_MIN_ZOOM) return mapHint(T.svZoom);
  const seq = ++svSeq;
  await tilesLoaded();
  if (seq !== svSeq) return;
  const { streets, walls } = surroundings(click, SV_SNAP_M + SV_RANGE_M + 30);
  let street = null;
  for (const { penalty, line } of streets) {
    for (let i = 1; i < line.length; i++) {
      const [x, y, d] = closestOnSegment(line[i - 1], line[i]);
      if (d <= SV_SNAP_M && (!street || d + penalty < street.score)) street = { score: d + penalty, p: [x, y] };
    }
  }
  if (!street) return mapHint(T.svNoStreet(SV_SNAP_M));
  const pos = fromOffset(click, ...street.p);
  const near = chunksIn(around(pos, SV_RANGE_M));
  await Promise.allSettled(near.map(loadChunk));
  if (seq !== svSeq) return;
  const candidates = [];
  for (const c of near) {
    for (const f of c.features ?? []) {
      if (f.geometry.type === "Point" || !inSelection(f.properties) || distM(pos, centroid(f)) > SV_RANGE_M + 100) continue;
      const d = ringDist(street.p, outline(f).map((v) => offsetM(click, v)));
      if (d <= SV_RANGE_M) candidates.push([d, f]);
    }
  }
  candidates.sort((a, b) => a[0] - b[0]);
  const hit = firstSeen(street.p, candidates.slice(0, 12).map(([, f]) => f), click, walls);
  if (hit) return showStreetView(pos, hit.f, hit.view, { from: click });
  mapHint(candidates.length ? T.svHidden : T.svNoBuilding(SV_RANGE_M));
}

/** "Show in street view" on a building: bring it into view if needed, then stand where it is best seen. */
async function viewBuilding(f) {
  const seq = ++svSeq;
  // The search reads the base-map tiles in view: zoom in, and centre a building near the edge.
  const { x, y } = map.project(centroid(f));
  const { clientWidth: w, clientHeight: h } = map.getContainer();
  if (map.getZoom() < SV_MIN_ZOOM || x < 100 || y < 100 || x > w - 100 || y > h - 100) {
    map.easeTo({ center: centroid(f), zoom: Math.max(map.getZoom(), 17), duration: reducedMotion ? 0 : 700 });
    await new Promise((resolve) => map.once("idle", resolve));
  }
  await tilesLoaded();
  if (seq !== svSeq) return;
  const view = viewpointFor(f);
  if (!view) return mapHint(T.svNoViewpoint(SV_VIEWPOINT_M));
  showStreetView(view.pos, f, view);
}

/** With a street view open, a clicked building is looked at from the same spot, if it can be seen from there. */
function reaim(f) {
  if (f.geometry.type === "Point" || distM(sv.pos, centroid(f)) > SV_RANGE_M + 100) return;
  svSeq += 1;
  const hit = firstSeen([0, 0], [f], sv.pos, surroundings(sv.pos, SV_RANGE_M + 130).walls);
  if (!hit) return mapHint(T.svNotFromHere);
  showStreetView(sv.pos, f, hit.view, { moved: sv.moved });
}

function closeStreetView() {
  svSeq += 1;
  sv.pos = sv.target = null;
  cancelAnimationFrame(drawCamera.raf);
  clearTimeout(drawCamera.timer);
  $("sv").hidden = true;
  $("svFrame").removeAttribute("src");
  $("stage").classList.remove("split");
  map.getSource("cone").setData({ type: "FeatureCollection", features: [] });
  map.setFilter("target", ["==", ["get", "osm_id"], ""]);
  map.resize();
}

/** Title, note and link of the street-view pane; called again when the language changes. */
function svHeader() {
  const p = sv.target.properties;
  const material = p[`n:${state.key}`];
  $("svTitle").textContent = [p.name ?? typeLabel(p.type), material && label(material)].filter(Boolean).join(" · ");
  $("svNote").textContent = T.svNote(nf.format(sv.dist), sv.moved >= 3 ? nf.format(sv.moved) : null);
  $("svLink").href = `https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${sv.pos[1].toFixed(6)},${sv.pos[0].toFixed(6)}&heading=${sv.heading.toFixed(0)}`;
}

/**
 * Opens (or re-aims) the street view at pos with the given heading at target. With from (the clicked point),
 * the camera slides from there to pos on the map, so a camera moved to the street is seen moving there;
 * moved is how far it was moved (shown in the note).
 */
function showStreetView(pos, target, { heading, reach }, { from = null, moved = from ? distM(from, pos) : 0 } = {}) {
  const dist = ringDist([0, 0], outline(target).map((c) => offsetM(pos, c)));
  Object.assign(sv, { pos, target, heading, dist, moved });
  svHeader();
  $("svFrame").src = `https://www.google.com/maps?layer=c&cbll=${pos[1]},${pos[0]}&cbp=11,${heading.toFixed(1)},0,0,0&output=svembed`;
  map.setFilter("target", ["==", ["get", "osm_id"], target.properties.osm_id]);
  $("sv").hidden = false;
  $("stage").classList.add("split");
  map.resize();
  drawCamera(pos, heading, Math.min(Math.max(reach * 1.1, 25), SV_RANGE_M * 1.5), from && distM(from, pos) > 1.5 ? from : null);
  showPoints([pos, centroid(target), ...(from ? [from] : [])]);
}

/** View cone and camera at pos; with from, animates the camera there and briefly marks the clicked point. */
function drawCamera(pos, heading, reach, from) {
  cancelAnimationFrame(drawCamera.raf);
  clearTimeout(drawCamera.timer);
  const draw = (at, mark) => {
    const arc = Array.from({ length: 13 }, (_, i) => destination(at, heading - SV_FOV / 2 + (i * SV_FOV) / 12, reach));
    const features = [
      { type: "Feature", properties: { kind: "cone" }, geometry: { type: "Polygon", coordinates: [[at, ...arc, at]] } },
      { type: "Feature", properties: { kind: "camera" }, geometry: { type: "Point", coordinates: at } },
    ];
    if (mark) {
      features.push(
        { type: "Feature", properties: { kind: "snap" }, geometry: { type: "LineString", coordinates: [mark, at] } },
        { type: "Feature", properties: { kind: "click" }, geometry: { type: "Point", coordinates: mark } },
      );
    }
    map.getSource("cone").setData({ type: "FeatureCollection", features });
  };
  if (!from) return draw(pos, null);
  const t0 = performance.now();
  const frame = (now) => {
    const k = reducedMotion ? 1 : Math.min((now - t0) / SNAP_MS, 1);
    const e = 1 - (1 - k) ** 3;
    draw([from[0] + (pos[0] - from[0]) * e, from[1] + (pos[1] - from[1]) * e], from);
    if (k < 1) drawCamera.raf = requestAnimationFrame(frame);
    else drawCamera.timer = setTimeout(() => draw(pos, null), 2000);
  };
  frame(t0);
}

/** Moves the map only if one of the points is outside the visible area (or too close to its edge). */
function showPoints(points) {
  const { clientWidth: w, clientHeight: h } = map.getContainer();
  const pad = Math.min(80, w / 5, h / 5);
  const inside = points.every((p) => {
    const { x, y } = map.project(p);
    return x > pad && y > pad && x < w - pad && y < h - pad;
  });
  if (inside) return;
  const b = points.reduce((acc, p) => acc.extend(p), new maplibregl.LngLatBounds(points[0], points[0]));
  map.fitBounds(b, { padding: pad, maxZoom: Math.max(map.getZoom(), 17.5), duration: reducedMotion ? 0 : 600 });
}
$("svClose").onclick = closeStreetView;

/** Drag (or arrow-key) the divider to resize map and street view; stacked layouts resize vertically. */
function setSplit(fraction) {
  $("stage").style.setProperty("--split", `${Math.min(Math.max(fraction, 0.15), 0.85) * 100}%`);
  map.resize();
}
const stacked = () => matchMedia("(max-width: 860px)").matches;
const splitNow = () => {
  const [stage, pane] = [$("stage"), $("mapwrap")].map((el) => el.getBoundingClientRect());
  return stacked() ? pane.height / stage.height : pane.width / stage.width;
};
const handle = $("svHandle");
handle.onpointerdown = (e) => {
  handle.setPointerCapture(e.pointerId);
  $("svFrame").style.pointerEvents = "none"; // the iframe would otherwise swallow the drag
};
handle.onpointermove = (e) => {
  if (!handle.hasPointerCapture(e.pointerId)) return;
  const r = $("stage").getBoundingClientRect();
  setSplit(stacked() ? (e.clientY - r.top) / r.height : (e.clientX - r.left) / r.width);
};
handle.onpointerup = handle.onpointercancel = () => ($("svFrame").style.pointerEvents = "");
handle.onkeydown = (e) => {
  const step = { ArrowLeft: -0.05, ArrowUp: -0.05, ArrowRight: 0.05, ArrowDown: 0.05 }[e.key];
  if (!step) return;
  e.preventDefault();
  setSplit(splitNow() + step);
};

/** The map hint: a passing message, else "loading", else the usage hint. */
function paintHint() {
  const el = $("maphint");
  el.textContent = mapHint.text ?? (loadingChunks ? T.loading : T.svHint);
  el.classList.toggle("alert", Boolean(mapHint.text));
}
function mapHint(text) {
  mapHint.text = text;
  paintHint();
  clearTimeout(mapHint.timer);
  mapHint.timer = setTimeout(() => {
    mapHint.text = null;
    paintHint();
  }, 6000);
}

function initMap() {
  map = new maplibregl.Map({
    container: "map",
    style: `https://tiles.openfreemap.org/styles/${dark ? "dark" : "positron"}`,
    bounds: [-5, 42, 25, 71.3],
    hash: "map", // #map=zoom/lat/lon keeps the view in the URL, so a view can be shared
  });
  const sharedView = location.hash.includes("map=");
  map.addControl(new maplibregl.NavigationControl({ showCompass: false }), "top-right");
  map.on("error", (e) => {
    if (!mapReady) $("maplegend").textContent = `${T.noMap} ${e.error?.message ?? ""}`;
  });
  map.once("style.load", () => {
    map.addSource("buildings", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
    map.addSource("centroids", { type: "geojson", data: { type: "FeatureCollection", features: centroidFeatures() } });
    const surface = css("--surface");
    map.addLayer({
      id: "dots", type: "circle", source: "centroids", maxzoom: 14,
      paint: {
        "circle-radius": ["interpolate", ["linear"], ["zoom"], 3, 1.6, 8, 2.6, 13, 5],
        "circle-opacity": ["interpolate", ["linear"], ["zoom"], 12.5, 0.85, 14, 0],
        "circle-stroke-width": ["interpolate", ["linear"], ["zoom"], 8, 0, 11, 1],
        "circle-stroke-color": surface,
        "circle-stroke-opacity": ["interpolate", ["linear"], ["zoom"], 12.5, 1, 14, 0],
      },
    });
    map.addLayer({ id: "fill", type: "fill", source: "buildings", minzoom: 12, paint: { "fill-opacity": 0.85 } });
    map.addLayer({ id: "outline", type: "line", source: "buildings", minzoom: 12, paint: { "line-color": surface, "line-width": 1 } });
    const ink = css("--ink");
    const kind = (k) => ["==", ["get", "kind"], k];
    map.addSource("cone", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
    map.addLayer({ id: "target", type: "line", source: "buildings", filter: ["==", ["get", "osm_id"], ""], paint: { "line-color": ink, "line-width": 3 } });
    map.addLayer({ id: "snap", type: "line", source: "cone", filter: kind("snap"), paint: { "line-color": ink, "line-width": 1.5, "line-dasharray": [2, 2] } });
    map.addLayer({
      id: "click", type: "circle", source: "cone", filter: kind("click"),
      paint: { "circle-radius": 5, "circle-color": "rgba(0,0,0,0)", "circle-stroke-color": ink, "circle-stroke-width": 1.5 },
    });
    map.addLayer({ id: "cone-fill", type: "fill", source: "cone", filter: kind("cone"), paint: { "fill-color": ink, "fill-opacity": 0.18 } });
    map.addLayer({ id: "cone-line", type: "line", source: "cone", filter: kind("cone"), paint: { "line-color": ink, "line-width": 1.5 } });
    map.addLayer({
      id: "camera", type: "circle", source: "cone", filter: kind("camera"),
      paint: { "circle-radius": 6, "circle-color": ink, "circle-stroke-color": surface, "circle-stroke-width": 2 },
    });
    // One handler for all layers. A building opens its popup (and re-aims an open street view);
    // a dot zooms in to its building; a street places the street-view camera there.
    map.on("click", (e) => {
      const hit = map.queryRenderedFeatures(e.point, { layers: ["fill"] })[0];
      if (hit) return buildingClick(hit.properties, e.lngLat);
      const dot = map.queryRenderedFeatures(e.point, { layers: ["dots"] })[0];
      if (dot) return map.flyTo({ center: dot.geometry.coordinates, zoom: 17, duration: reducedMotion ? 0 : 1600 });
      streetClick(e.lngLat.toArray());
    });
    for (const layer of ["dots", "fill"]) {
      map.on("mouseenter", layer, () => (map.getCanvas().style.cursor = "pointer"));
      map.on("mouseleave", layer, () => (map.getCanvas().style.cursor = ""));
    }
    map.on("moveend", syncChunks);
    mapReady = true;
    updateMap();
    if (!sharedView) fitCountry();
  });
}

function buildingClick(p, lngLat) {
  const popup = new maplibregl.Popup({ maxWidth: "280px" }).setLngLat(lngLat).setHTML(popupHtml(p)).addTo(map);
  const f = byId.get(p.osm_id);
  popup.getElement().querySelector(".svbtn").onclick = () => {
    popup.remove();
    if (f) viewBuilding(f);
  };
  if (sv.pos && f) reaim(f);
}

setLang(state.lang);
if (!WEB || !window.OSM_POINTS) {
  $("side").innerHTML = `<div id="missing">${T.noData}</div>`;
} else {
  render();
  if (window.maplibregl) initMap();
  else $("map").innerHTML = `<p style="padding:24px">${T.noMap}</p>`;
}
</script>
</body>
</html>
